# Release flow
#
# 1. Every push to main runs release-please. It reads the Conventional Commits since the last
#    release and keeps a "chore(main): release x.y.z" pull request open, with the version bump
#    (package.json, Cargo.toml, Cargo.lock) and the new CHANGELOG.md entry.
# 2. Merging that pull request makes release-please tag vX.Y.Z and publish a GitHub Release.
# 3. The build job then builds Sentiong on macOS, Windows and Linux and uploads the installers
#    to that release.
# 4. The checksums job publishes SHA256SUMS.txt and a signed build provenance attestation, so
#    anyone can check that an installer came from this workflow:
#    gh attestation verify <file> --repo ramizbrain/sentiong
#
# Every action is pinned to a commit SHA (Dependabot keeps them current), so a moved tag in a
# third-party action cannot change what runs here.
#
# Releases created with GITHUB_TOKEN do not trigger other workflows, so the build has to live
# in this workflow rather than in a separate `on: release` one.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One .dmg that runs on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            # The oldest supported Ubuntu, so the AppImage/.deb run on older glibc too.
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Uncomment once the Apple Developer ID secrets exist,
          # and remove `"signingIdentity": "-"` from src-tauri/tauri.conf.json.
          # See https://v2.tauri.app/distribute/sign/macos/
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Sentiong ${{ needs.release-please.outputs.tag_name }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

  checksums:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the attestation through Sigstore and storing it on GitHub.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checksum the release installers
        run: |
          mkdir installers
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installers
          (cd installers && sha256sum -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Publish the checksums
        run: gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
